name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 防线：在此之前只有本地 deploy.ps1 跑自检，任何人（包括自己）直接 git push
  # 都会跳过全部断言——防线只在一条路上存在，等于没有。这里让它对每条路径都生效。
  # check.js 是离线的（自制 DOM 模拟，不联网、不装依赖），可以放心放进阻塞链。
  # verify-wiki.js / audit-completeness.js 需要联网，刻意不放进阻塞链（否则会因外网抖动误红）。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 全量自检
        run: node test/check.js

  deploy:
    needs: test # ← 关键：自检不过就不部署
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # 只发布站点文件：原先 path 是 "."，整个仓库（test/ scripts/ docs/ README）都会被公开。
      # 新增上线文件时记得加进下面这个列表。
      - name: 组装站点产物
        run: |
          mkdir -p dist
          for p in index.html .nojekyll robots.txt sitemap.xml favicon.ico apple-touch-icon.png css js img; do
            if [ -e "$p" ]; then cp -r "$p" dist/; fi
          done
          echo "--- 待发布内容 ---"
          ls -A dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
