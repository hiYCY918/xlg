<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="星露谷物语攻略站：农作物、收集物、钓鱼、采矿、战斗、任务、NPC、节日、事件、社区中心收集包一站式攻略" />
  <title>星露谷物语 · 攻略站</title>
  <link rel="stylesheet" href="css/style.css?v=37" />
</head>
<body>
  <!-- 顶部品牌栏（导航已移入左侧侧栏） -->
  <header class="site-head">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-logo">
            <span class="brand-fallback">🌾</span>
            <img src="img/npc-junimo.png" alt="" decoding="async"
                 onload="this.previousElementSibling.remove()"
                 onerror="this.remove()">
          </span>
          <span class="brand-name">星露谷物语<small>攻略站</small></span>
        </div>
        <div class="topbar-search">
          <input id="globalSearch" type="text" placeholder="🔍 搜索作物 / 鱼 / NPC / 节日…" autocomplete="off" />
          <div class="search-drop" id="searchDrop" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <!-- 左侧模块侧栏 + 内容区（都是同一个 flex 行；窄屏时 flex 变纵向，
       导航自动变回顶部的横向滚动条——同一份 DOM，不重复维护两套） -->
  <div class="layout">
    <nav class="nav" id="nav" aria-label="模块导航"></nav>
    <main class="page" id="page"></main>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <footer class="footer">
    <p>数据为星露谷物语示例内容，可在 <code>js/data.js</code> 中自由补充修改</p>
  </footer>

  <script src="js/data.js?v=37"></script>
  <script src="js/icons.js?v=37"></script>
  <script src="js/main.js?v=37"></script>
</body>
</html>
