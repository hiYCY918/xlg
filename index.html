<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="星露谷物语攻略站：农作物、收集物、钓鱼、采矿、战斗、任务、NPC、节日、事件、社区中心收集包一站式攻略" />
  <title>星露谷物语 · 攻略站</title>
  <!-- 规范链接：全站只此一个可索引 URL（单页 + hash 路由，hash 不会被搜索引擎单独收录） -->
  <link rel="canonical" href="https://hiycy918.github.io/xlg/" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <!-- 分享到微信 / QQ / Twitter 时的卡片预览（og:image 必须是绝对 URL，否则抓不到） -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="星露谷物语 · 攻略站" />
  <meta property="og:title" content="星露谷物语 · 攻略站" />
  <meta property="og:description" content="像素风中文攻略：农作物、钓鱼、采矿、建筑、武器…数据速查，社区中心收集包与博物馆捐赠进度可勾选留存" />
  <meta property="og:url" content="https://hiycy918.github.io/xlg/" />
  <meta property="og:image" content="https://hiycy918.github.io/xlg/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="星露谷物语 · 攻略站" />
  <meta name="twitter:description" content="像素风中文攻略：数据速查 + 收集包与博物馆进度勾选" />
  <meta name="twitter:image" content="https://hiycy918.github.io/xlg/og-cover.png" />
  <!-- 结构化数据：告诉搜索引擎这是什么站、什么语言、对应的规范 URL -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "星露谷物语 · 攻略站",
    "alternateName": "Stardew Valley 中文攻略站",
    "url": "https://hiycy918.github.io/xlg/",
    "inLanguage": "zh-CN",
    "description": "非官方粉丝攻略站：星露谷物语物品、生物、建筑与进度数据的像素风速查页面"
  }
  </script>
  <link rel="stylesheet" href="css/style.css?v=49" />
</head>
<body>
  <!-- 顶部品牌栏（导航已移入左侧侧栏） -->
  <header class="site-head">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-logo">
            <span class="brand-fallback">🌾</span>
            <img src="img/npc-junimo.png" alt="" decoding="async"
                 onload="this.previousElementSibling.remove()"
                 onerror="this.remove()">
          </span>
          <span class="brand-name">星露谷物语<small>攻略站</small></span>
        </div>
        <div class="topbar-search">
          <input id="globalSearch" type="text" placeholder="🔍 搜索作物 / 鱼 / NPC / 节日…" autocomplete="off" />
          <div class="search-drop" id="searchDrop" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <!-- 左侧模块侧栏 + 内容列（同一个 flex 行；窄屏时 flex 变纵向，
       导航自动变回顶部的横向滚动条——同一份 DOM，不重复维护两套）
       ⚠️ 页脚必须放在 .main-col **里面**：侧栏是 sticky 的，粘附范围就是 .layout；
       页脚若留在 .layout 之外，滚到页面最底时侧栏会被顶上去、下方露出一条空白。 -->
  <div class="layout">
    <nav class="nav" id="nav" aria-label="模块导航"></nav>
    <div class="main-col">
      <main class="page" id="page"></main>
      <footer class="footer">
        <p>本站为<strong>非官方粉丝攻略</strong>，与 ConcernedApe 无隶属关系；游戏素材、名称与数据的版权归 <strong>ConcernedApe</strong> 所有（Stardew Valley © ConcernedApe）</p>
        <p>攻略数据对应游戏版本 <strong>1.6</strong> · 最后更新 <time datetime="2026-10-09">2026-10-09</time> · 欢迎在 <code>js/data.js</code> 中补充修改</p>
      </footer>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script src="js/data.js?v=49"></script>
  <script src="js/icons.js?v=49"></script>
  <script src="js/main.js?v=49"></script>
</body>
</html>
