<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="星露谷物语攻略站：农作物、收集物、钓鱼、采矿、战斗、任务、NPC、节日、事件一站式攻略" />
  <title>星露谷物语 · 攻略站</title>
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <!-- 顶部整体（品牌栏 + 横向导航） -->
  <header class="site-head">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-logo">🌾</span>
          <span class="brand-name">星露谷物语<small>攻略站</small></span>
        </div>
        <div class="topbar-search">
          <input id="globalSearch" type="text" placeholder="🔍 搜索作物 / 鱼 / NPC / 节日…" autocomplete="off" />
          <div class="search-drop" id="searchDrop" hidden></div>
        </div>
      </div>
    </div>
    <!-- 横向模块导航（由 JS 生成） -->
    <nav class="nav" id="nav"></nav>
  </header>

  <!-- 内容区（由 JS 生成各模块） -->
  <main class="page" id="page"></main>

  <!-- 详情弹窗 -->
  <div class="modal-mask" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <footer class="footer">
    <p>数据为星露谷物语示例内容，可在 <code>js/data.js</code> 中自由补充修改</p>
  </footer>

  <script src="js/data.js?v=6"></script>
  <script src="js/icons.js?v=6"></script>
  <script src="js/main.js?v=6"></script>
</body>
</html>
